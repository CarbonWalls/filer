<script>
// Boot diagnostics: visible on the page itself so a frozen screen is never
// a silent mystery. Runs before app.js and reports errors inline.
(function () {
  var log = ["[boot] inline script ran"];
  window.__filerBoot = {
    log: log,
    ready: false,
    error: null,
  };
  function flush(force) {
    if (!force && !window.__filerBoot && !window.__filerBootUnknown) return;
    var el = document.getElementById("boot-status");
    if (!el) {
      el = document.createElement("div");
      el.id = "boot-status";
      el.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;" +
        "font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#fff;" +
        "background:#1b1d1f;padding:6px 12px;white-space:pre-wrap;word-break:break-word;";
      document.body.appendChild(el);
    }
    el.style.display = "block";
    el.textContent = (window.__filerBoot ? window.__filerBoot.log : []).join("\n");
  }
  window.addEventListener("error", function (e) {
    var msg = "[error] " + (e.message || e.error || "unknown");
    if (window.__filerBoot) window.__filerBoot.log.push(msg);
    flush(true);
  });
  window.addEventListener("unhandledrejection", function (e) {
    var msg = "[rejection] " + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
    if (window.__filerBoot) window.__filerBoot.log.push(msg);
    flush(true);
  });
  // Watchdog: if init never completes, tell the user.
  setTimeout(function () {
    if (window.__filerBoot && (!window.__filerBoot.ready)) {
      window.__filerBoot.log.push("[watchdog] init() did NOT complete within 8s");
      window.__filerBoot.log.push("[watchdog] last milestone: " + (window.__filerBoot.last || "none"));
      flush(true);
    }
  }, 8000);

  // Element self-diagnostic: report what element actually receives a tap at the
  // center of the screen. If a stray overlay is swallowing input, its id will
  // show here even when init() reports "complete". Runs after paint.
  setTimeout(function () {
    try {
      var el = document.elementFromPoint(
        (window.innerWidth || 320) / 2,
        (window.innerHeight || 480) / 2
      );
      var id = el ? (el.id ? "#" + el.id : (el.className ? "." + el.className : el.tagName)) : "(none)";
      if (window.__filerBoot) window.__filerBoot.log.push("[center-tap] " + id);
      // If something OTHER than the listing/app is on top, flag it.
      if (el && el.id && el.id !== "app" && el.id !== "listing" &&
          !el.closest("#listing") && !el.closest("#crumbs") &&
          !el.closest("#toolbar") && !el.closest("#bar2")) {
        window.__filerBoot.log.push("[center-tap] WARNING: top element is not the main UI -> " + id);
        flush(true);
      }
    } catch (e) {
      if (window.__filerBoot) window.__filerBoot.log.push("[center-tap] probe failed: " + e.message);
    }
  }, 1500);
})();
</script>

<div id="app">
  <aside id="rail">
    <div class="rail-title">
      <svg class="ic" width="18" height="18"><use href="#i-folder"/></svg>
      <span>Filer</span>
    </div>
    <div class="rail-section-label">Places</div>
    <nav id="places"></nav>
    <div class="rail-section-label">Tools</div>
    <nav>
      <button class="nav-item" id="nav-plugins">
        <svg class="ic" width="15" height="15"><use href="#i-plug"/></svg>
        <span>Plugins</span><span class="badge" id="plug-badge" hidden></span>
      </button>
    </nav>
    <div class="rail-spacer"></div>
    <div class="rail-foot" id="rail-foot"></div>
  </aside>

  <main id="main">
    <header id="topbar">
      <div id="crumbs" hidden></div>
      <div class="hrow">
        <button class="btn icon-btn" id="btn-up" title="Up (Backspace)">
          <svg class="ic" width="16" height="16"><use href="#i-up"/></svg>
        </button>
        <input id="addr" class="addr" spellcheck="false" autocomplete="off" placeholder="Path">
        <div class="hacts">
          <button class="btn icon-btn" id="btn-new" title="Create">
            <svg class="ic" width="16" height="16"><use href="#i-plus"/></svg>
          </button>
          <button class="btn icon-btn" id="btn-refresh" title="Refresh (Ctrl+R)">
            <svg class="ic" width="16" height="16"><use href="#i-refresh"/></svg>
          </button>
          <button class="btn icon-btn" id="btn-split" title="Split view">
            <svg class="ic" width="16" height="16"><use href="#i-split"/></svg>
          </button>
          <button class="btn icon-btn" id="btn-close-split" title="Close split" hidden>
            <svg class="ic" width="16" height="16"><use href="#i-x"/></svg>
          </button>
          <button class="btn icon-btn" id="btn-grid" title="Toggle grid / list">
            <svg class="ic" width="16" height="16"><use href="#i-grid"/></svg>
          </button>
          <button class="btn icon-btn" id="btn-plugins" title="Plugins">
            <svg class="ic" width="16" height="16"><use href="#i-plug"/></svg>
          </button>
          <button class="btn icon-btn hotbar-more" id="btn-more" title="Menu">
            <svg class="ic" width="16" height="16"><use href="#i-dots"/></svg>
          </button>
        </div>
      </div>
      <div id="moremenu" class="menu pop" hidden>
        <div class="menu-label">Places</div>
        <button class="menu-item" id="mm-home"><span class="mm-ic"><svg class="ic" width="14" height="14"><use href="#i-home"/></svg></span> Home</button>
        <div id="mm-places"></div>
        <div class="menu-sep"></div>
        <div class="menu-label">Tools</div>
        <button class="menu-item" id="mm-plugins"><span class="mm-ic"><svg class="ic" width="14" height="14"><use href="#i-plug"/></svg></span> Plugins</button>
        <button class="menu-item" id="mm-split"><span class="mm-ic"><svg class="ic" width="14" height="14"><use href="#i-split"/></svg></span> Split view</button>
        <button class="menu-item" id="mm-filter"><span class="mm-ic"><svg class="ic" width="14" height="14"><use href="#i-search"/></svg></span> Filter</button>
        <button class="menu-item" id="mm-refresh"><span class="mm-ic"><svg class="ic" width="14" height="14"><use href="#i-refresh"/></svg></span> Refresh</button>
      </div>
      <div id="addrmenu" class="menu pop" hidden>
        <button class="menu-item" data-act="mkdir">New Folder</button>
        <button class="menu-item" data-act="newfile">New File</button>
      </div>
      <div id="filtermenu" class="menu pop" hidden>
        <div class="filter-head">
          <input id="filter-input" type="search" placeholder="Filter by name" spellcheck="false" autocomplete="off">
          <button class="btn icon-btn" id="filter-clear" title="Clear">
            <svg class="ic" width="14" height="14"><use href="#i-x"/></svg>
          </button>
        </div>
        <div id="filter-spinner" hidden>
          <div class="spinner"></div>
        </div>
        <div id="filter-list"></div>
        <div class="filter-foot">
          <span id="filter-count"></span>
        </div>
      </div>
    </header>

    <section id="listing" class="as-list"></section>
    <div id="empty" class="empty" hidden></div>

    <footer id="statusbar">
      <span id="status-left"></span>
      <span class="spacer"></span>
      <span id="status-right"></span>
    </footer>
  </main>
</div>

<div id="preview">
  <header class="pv-bar">
    <button class="btn icon-btn" id="pv-close" title="Close (Esc)">
      <svg class="ic" width="16" height="16"><use href="#i-x"/></svg>
    </button>
    <div class="pv-meta"><span id="pv-name"></span><span id="pv-sub" class="mut"></span></div>
    <span class="spacer"></span>
    <span id="pv-dirty" class="mut" hidden></span>
    <button class="btn" id="pv-save" hidden>Save</button>
  </header>
  <div class="pv-body" id="pv-body"></div>
</div>

<div id="drawer" class="pop">
  <header class="dr-bar">
    <div class="dr-title">Plugins</div>
    <button class="btn icon-btn" id="dr-close">
      <svg class="ic" width="15" height="15"><use href="#i-x"/></svg>
    </button>
  </header>
  <div id="dr-list"></div>
  <footer class="dr-foot mut">
    Drop a folder into <code>plugins/</code> or <code>examples/</code> — it loads live.
  </footer>
</div>

<div id="ctx" class="menu pop" hidden></div>
<div id="modal-root" hidden></div>
<div id="toasts"></div>

<input type="file" id="file-input" multiple hidden>

<script type="module" src="/app.js?v=9"></script>
</body>
